<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Graduation Requirements</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">

        <div style="margin-bottom: 15px; font-size: 14px; color: var(--text-muted);">
            <span th:if="${isEditable}" style="color: #f59e0b; font-weight: 600;">⬤ Edit Mode Active</span>
            <span th:if="${!isEditable}">⬤ View Mode (Read-Only)</span>
        </div>

        <h2 class="section-title" style="margin-top: 0;">Graduation Requirements - <span
                th:text="${degree.splname}">Specialization</span></h2>

        <div class="table-container">
            <table class="data-table">
                <tbody>
                    <tr>
                        <th scope="row">Minimum Credit Load per Semester</th>
                        <td th:text="${degree.splMinCreditLoad}">0</td>
                    </tr>
                    <tr>
                        <th scope="row">Maximum Credit Load per Semester</th>
                        <td th:text="${degree.splMaxCreditLoad}">0</td>
                    </tr>
                    <tr>
                        <th scope="row">Minimum Courses per Semester</th>
                        <td th:text="${degree.splMinCourses}">0</td>
                    </tr>
                    <tr>
                        <th scope="row">Maximum Courses per Semester</th>
                        <td th:text="${degree.splMaxCourses}">0</td>
                    </tr>
                    <tr>
                        <th scope="row">Minimum CPI</th>
                        <td th:text="${degree.splMinCpi}">0.00</td>
                    </tr>
                    <tr>
                        <th scope="row">Minimum Credits</th>
                        <td th:text="${degree.splMinCredits}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="bottom-actions">
            <a th:if="${isEditable}" class="btn-primary-custom"
                th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/graduation-requirements/edit (programId=${programId}, schemeId=${scheme.id}, splid=${degree.splid})}">Edit
                Requirements</a>

            <div class="ms-auto">
                <a class="btn-outline"
                    th:href="${isEditable} ? @{/admin/programs/{programId}/edit/schemes/{schemeId} (programId=${programId}, schemeId=${scheme.id})} : @{/admin/programs/{programId}/view/schemes/{schemeId} (programId=${programId}, schemeId=${scheme.id})}">←
                    Back to Scheme</a>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

</body>

</html>
