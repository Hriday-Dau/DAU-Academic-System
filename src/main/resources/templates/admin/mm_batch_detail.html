<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Students Roster - Master Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .batch-summary-card {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            padding: 24px;
            margin-bottom: 24px;
            border-left: 5px solid var(--primary);
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .summary-item label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .summary-item value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .search-input {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-sm);
            font-size: 14px;
            width: 320px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div>
                <h2 class="section-title" style="margin-bottom: 4px;">
                    Batch Roster: <span th:text="${batch.bchname}">Batch</span>
                </h2>
                <p style="color: var(--text-muted); font-size: 14px;">Students enrolled in this academic batch.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/admin/master-maintenance/batches}" class="btn-outline">&larr; Batches List</a>
                <a th:href="@{/admin/master-maintenance/batches/{id}/edit(id=${batch.bchid})}" class="btn-warning" style="padding: 8px 16px;">Edit Batch</a>
                <a th:href="@{/admin/master-maintenance/batches/{id}/import(id=${batch.bchid})}" class="btn">+ Import Students (CSV)</a>
            </div>
        </div>

        <!-- Flash messages -->
        <div th:if="${success}" class="alert-success" style="padding: 12px 16px; background-color: #d1fae5; color: #065f46; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-danger" style="padding: 12px 16px; background-color: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${error}"></span>
        </div>

        <!-- Batch Summary Banner -->
        <div class="batch-summary-card">
            <div class="summary-grid">
                <div class="summary-item">
                    <label>Batch ID</label>
                    <value th:text="${batch.bchid}"></value>
                </div>
                <div class="summary-item">
                    <label>Program</label>
                    <value th:text="${batch.programs != null ? batch.programs.prgname : '-'}"></value>
                </div>
                <div class="summary-item">
                    <label>Intake Capacity</label>
                    <value th:text="${batch.bchcapacity}"></value>
                </div>
                <div class="summary-item">
                    <label>Enrolled Students</label>
                    <value style="color: var(--primary);" th:text="${#lists.size(students)}">0</value>
                </div>
                <div class="summary-item">
                    <label>Institute Code</label>
                    <value th:text="${batch.bchinstcode != null ? batch.bchinstcode : '-'}"></value>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="top-actions" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div>
                    <input type="text" id="studentSearch" class="search-input" placeholder="Filter by student ID, name, or email...">
                </div>
                <div style="font-size: 14px; color: var(--text-muted);">
                    Showing <strong th:text="${#lists.size(students)}">0</strong> student(s)
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table" id="studentsTable">
                    <thead>
                        <tr>
                            <th style="width: 8%; text-align: center;">ID</th>
                            <th style="width: 15%;">Institute ID</th>
                            <th style="width: 25%;">Student Name</th>
                            <th style="width: 25%;">Email</th>
                            <th style="width: 8%; text-align: center;">Gender</th>
                            <th style="width: 11%;">DOB</th>
                            <th style="width: 8%; text-align: center;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                No students found in this batch yet. Click "Import Students (CSV)" above to add students.
                            </td>
                        </tr>
                        <tr th:each="s : ${students}">
                            <td style="text-align: center; font-weight: 600;" th:text="${s.stdid}"></td>
                            <td style="font-weight: 600; color: var(--primary-dark);" th:text="${s.stdinstid}"></td>
                            <td th:text="${s.stdfirstname + (s.stdmiddlename != null and !s.stdmiddlename.isEmpty() ? ' ' + s.stdmiddlename : '') + ' ' + s.stdlastname}"></td>
                            <td th:text="${s.stdemail != null ? s.stdemail : '-'}"></td>
                            <td style="text-align: center;" th:text="${s.stdgender != null ? s.stdgender : '-'}"></td>
                            <td th:text="${s.stddob != null ? #temporals.format(s.stddob, 'dd-MM-yyyy') : '-'}"></td>
                            <td style="text-align: center;">
                                <span th:if="${s.stdstatus == 'A' or s.stdstatus == null}" style="color: #059669; font-weight: 600;">Active</span>
                                <span th:if="${s.stdstatus != 'A' and s.stdstatus != null}" style="color: #dc2626; font-weight: 600;" th:text="${s.stdstatus}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Client-side real-time filter script -->
    <script>
        document.getElementById('studentSearch')?.addEventListener('keyup', function() {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll('#studentsTable tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        });
    </script>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
