<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${editing} ? 'Edit Specialization' : 'Add Specialization'">Specialization Form</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">
        <h2 class="section-title" th:text="${editing} ? 'Edit Specialization' : 'Add Specialization'"
            style="margin-top: 0;">Specialization</h2>

        <div class="form-container">
            <form
                th:action="@{/admin/programs/{programId}/edit/schemes/{schemeId}/degree/save (programId=${programId}, schemeId=${degree.schemeId})}"
                th:object="${degree}" method="post">

                <input type="hidden" th:field="*{schemeId}" />

                <div class="form-row">
                    <div class="form-group" th:if="${editing}">
                        <label class="form-label">Specialization ID</label>
                        <input type="hidden" th:field="*{splid}" />
                        <input type="number" class="form-control" th:value="*{splid}" disabled />
                    </div>

                    <div class="form-group" th:unless="${editing}">
                        <label class="form-label">Specialization ID</label>
                        <input type="number" class="form-control" th:field="*{splid}" required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Specialization Name</label>
                        <input type="text" class="form-control" th:field="*{splname}" required />
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{spldesc}"></textarea>
                </div>

                <h4
                    style="font-size: 16px; color: var(--primary-dark); margin-bottom: 16px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px;">
                    Credit & Course Constraints</h4>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Minimum Credit Load per Semester</label>
                        <input type="number" class="form-control" th:field="*{splMinCreditLoad}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Maximum Credit Load per Semester</label>
                        <input type="number" class="form-control" th:field="*{splMaxCreditLoad}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Minimum Courses per Semester</label>
                        <input type="number" class="form-control" th:field="*{splMinCourses}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Maximum Courses per Semester</label>
                        <input type="number" class="form-control" th:field="*{splMaxCourses}" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Minimum CPI</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{splMinCpi}" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Minimum Credits</label>
                        <input type="number" class="form-control" th:field="*{splMinCredits}" />
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Save Specialization</button>
                    <a th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId} (programId=${programId}, schemeId=${degree.schemeId})}"
                        class="btn-danger" style="text-decoration: none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

</body>

</html>
