<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Academic Years List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">

    <style>
        .main-content {
            margin-top: 30px;
            margin-bottom: 50px;
        }

        .table-container {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            padding: 12px 16px;
            background-color: var(--primary-dark);
            color: var(--white);
            font-weight: 500;
            font-size: 14px;
            border: 1px solid #e5e7eb;
        }

        .data-table td {
            padding: 12px 16px;
            color: var(--text-dark);
            font-size: 14px;
            border: 1px solid #e5e7eb;
            vertical-align: middle;
        }

        .data-table tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #15803d;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-weight: 500;
            border-left: 4px solid #22c55e;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">
        <h2 class="section-title">Academic Years</h2>

        <div th:if="${success}" class="alert-success" id="flashMessage">
            <span th:text="${success}"></span>
        </div>

        <!-- <a class="btn btn-primary btn-sm mt-3 mb-3" th:href="@{/admin/academicyears/add}">
        + Add Academic Year
    </a> -->

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th style="text-align: center; width: 50%;">Academic Year ID</th>
                        <th style="text-align: center; width: 50%;">Academic Year</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="ay : ${academicyears}">
                        <td style="text-align: center;" th:text="${ay.ayrid}"></td>
                        <td style="text-align: center;" th:text="${ay.ayrname}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alert = document.getElementById('flashMessage');
            if (alert) alert.style.display = 'none';
        }, 3000);
    </script>

</body>

</html>
