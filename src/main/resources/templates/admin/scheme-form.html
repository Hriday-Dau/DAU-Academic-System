<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Scheme Form</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>


    <div class="container main-content">
        <h2 class="section-title" th:text="${editing} ? 'Edit Scheme' : 'Add Scheme'" style="margin-top: 0;">Add Scheme
        </h2>

        <div class="form-container">
            <div th:if="${error}" class="alert-error" id="flashMessage">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/admin/programs/{programId}/edit/schemes/save (programId=${scheme.program.prgid})}"
                th:object="${scheme}" method="post">
                <input type="hidden" name="editing" th:value="${editing}" />

                <!-- Hidden input for program_id -->
                <input type="hidden" th:field="*{program.prgid}" />

                <div class="form-group" th:if="${editing}">
                    <label class="form-label">Scheme ID</label>
                    <input type="hidden" th:field="*{id}" />
                    <input type="number" class="form-control" th:value="*{id}" disabled />
                </div>

                <div class="form-group" th:unless="${editing}">
                    <label class="form-label" for="id">Scheme ID</label>
                    <input type="number" class="form-control" th:field="*{id}" id="id" required />
                </div>

                <div class="form-group" th:if="${editing}">
                    <label class="form-label">Effective From Year</label>
                    <input type="hidden" th:field="*{effectiveFromYear}" />
                    <input type="number" class="form-control" th:value="*{effectiveFromYear}" disabled />
                </div>

                <div class="form-group" th:unless="${editing}">
                    <label class="form-label" for="year">Effective From Year</label>
                    <input type="number" class="form-control" th:field="*{effectiveFromYear}" id="year" required
                        placeholder="e.g., 2024" />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Save Scheme</button>
                    <a th:href="@{/admin/programs/{id}/edit (id=${scheme.program.prgid})}" class="btn-danger"
                        style="text-decoration: none;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alertElement = document.getElementById('flashMessage');
            if (alertElement) alertElement.style.display = 'none';
        }, 5000);
    </script>
</body>

</html>
