<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Scheme Courses</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="container main-content">

        <div style="margin-bottom: 15px; font-size: 14px; color: var(--text-muted);">
            <span th:if="${isEditable}" style="color: #f59e0b; font-weight: 600;">⬤ Edit Mode Active</span>
            <span th:if="${!isEditable}">⬤ View Mode (Read-Only)</span>
        </div>

        <h2 class="section-title" style="margin-top: 0; margin-bottom: 30px;">Scheme Courses (ID: <span
                th:text="${schemeId}"></span>)</h2>

        <div th:each="entry : ${groupedCourses}">

            <div class="table-container">
                <h4 class="semester-title" th:text="${entry.key.semesterName}">Semester Name</h4>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Course Code</th>
                                <th>Course Title</th>
                                <th>Course Type</th>
                                <th>Lecture Hours</th>
                                <th>Tutorial Hours</th>
                                <th>Practical Hours</th>
                                <th>Total Credits</th>
                                <th th:if="${isEditable}" style="text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="course : ${entry.value}">
                                <td th:text="${course.course != null} ? ${course.course.crscode} : ''"></td>
                                <td th:text="${course.courseTitle}" style="font-weight: 500;">Intro to CS</td>
                                <td th:text="${course.courseType != null} ? ${course.courseType.ctpcode} : ''"></td>
                                <td th:text="${course.course != null} ? ${course.course.crslectures} : ''"></td>
                                <td th:text="${course.course != null} ? ${course.course.crstutorials} : ''"></td>
                                <td th:text="${course.course != null} ? ${course.course.crspracticals} : ''"></td>
                                <td th:text="${course.course != null} ? ${course.course.crscreditpoints} : ''"></td>

                                <td th:if="${isEditable}" class="action-cell">
                                    <div class="action-buttons-wrapper">
                                        <span th:if="${course.splid} == ${splid}" style="display: flex; gap: 8px;">
                                            <a class="btn-warning"
                                                th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/scheme-courses/edit (programId=${programId}, schemeId=${schemeId}, splid=${splid}, termName=${course.termName}, programYear=${course.programYear}, courseSrNo=${course.courseSrNo})}">
                                                Edit
                                            </a>
                                            <a class="btn-danger"
                                                th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/scheme-courses/delete (programId=${programId}, schemeId=${schemeId}, splid=${splid}, termName=${course.termName}, programYear=${course.programYear}, courseSrNo=${course.courseSrNo})}"
                                                onclick="return confirm('Are you sure you want to delete this course?');">
                                                Delete
                                            </a>
                                        </span>
                                        <span th:unless="${course.splid} == ${splid}" style="display: flex; gap: 8px;">
                                            <button class="btn-outline-muted"
                                                onclick="alert('This course belongs to the general degree; update it from the general degree page.');">Edit</button>
                                            <button class="btn-outline-muted"
                                                onclick="alert('This course belongs to the general degree; update it from the general degree page.');">Delete</button>
                                        </span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(entry.value)}">
                                <td th:colspan="${isEditable ? 8 : 7}"
                                    style="text-align: center; padding: 20px; font-style: italic; color: var(--text-muted);">
                                    No courses added to this scheme yet.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <a th:if="${isEditable}" class="btn-success" style="margin-top: 16px;"
                    th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/scheme-courses/add (programId=${programId}, schemeId=${schemeId}, splid=${splid}, termName=${entry.key.termName}, programYear=${entry.key.programYear}, semesterName=${entry.key.semesterName}, termSeqNo=${entry.key.termSeqNo})}">
                    + Add Course to <span th:text="${entry.key.semesterName}"></span>
                </a>
            </div>
        </div>

        <div class="bottom-actions">
            <a class="btn-outline" style="text-decoration: none;"
                th:href="${isEditable} ? @{/admin/programs/{programId}/edit/schemes/{schemeId} (programId=${programId}, schemeId=${schemeId})} : @{/admin/programs/{programId}/view/schemes/{schemeId}/ (programId=${programId}, schemeId=${schemeId})}">
                ← Back to Scheme
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

</body>

</html>
