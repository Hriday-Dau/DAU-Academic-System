<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles Master - Master Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div>
                <h2 class="section-title" style="margin-bottom: 4px;">Security Roles Master</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Master directory of institutional security roles configured in the portal.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/admin/master-maintenance}" class="btn-outline">Back to Hub</a>
                <a th:href="@{/admin/master-maintenance/roles/add}" class="btn">+ Add New Role</a>
            </div>
        </div>

        <!-- Flash messages -->
        <div th:if="${success}" class="alert-success" style="padding: 12px 16px; background-color: #d1fae5; color: #065f46; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-danger" style="padding: 12px 16px; background-color: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${error}"></span>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 15%; text-align: center;">Role ID (Code)</th>
                            <th style="width: 35%;">Role Name</th>
                            <th style="width: 50%;">Comments / Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                No roles defined yet. Click "+ Add New Role" to register a security role.
                            </td>
                        </tr>
                        <tr th:each="r : ${roles}">
                            <td style="text-align: center; font-weight: 700; color: var(--primary-dark);" th:text="${r.rid}"></td>
                            <td style="font-weight: 600;" th:text="${r.roleName}"></td>
                            <td style="color: var(--text-muted);" th:text="${r.comments != null and !r.comments.isEmpty() ? r.comments : '-'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
