<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Batch - Master Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .form-card {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            padding: 32px;
            max-width: 720px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .form-control-custom {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: border-color 0.15s ease;
        }
        .form-control-custom:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(15, 57, 182, 0.12);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 class="section-title" style="margin-bottom: 0;">Edit Academic Batch</h2>
            <a th:href="@{/admin/master-maintenance/batches/{id}(id=${batch.bchid})}" class="btn-outline">&larr; Back to Batch Details</a>
        </div>

        <div th:if="${error}" class="alert-danger" style="padding: 12px 16px; background-color: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); margin-bottom: 20px; max-width: 720px; margin-left: auto; margin-right: auto;">
            <span th:text="${error}"></span>
        </div>

        <div class="form-card">
            <form th:action="@{/admin/master-maintenance/batches/{id}/edit(id=${batch.bchid})}" th:object="${form}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="form-label">Batch ID</label>
                        <input type="text" class="form-control-custom" th:value="${batch.bchid}" disabled style="background-color: #f3f4f6; color: #4b5563;" />
                    </div>

                    <div class="col-md-6 form-group">
                        <label class="form-label">Program</label>
                        <input type="text" class="form-control-custom" th:value="${batch.programs != null ? batch.programs.prgname : '-'}" disabled style="background-color: #f3f4f6; color: #4b5563;" />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="bchname">Batch Name <span style="color: #dc2626;">*</span></label>
                        <input type="text" id="bchname" name="bchname" th:value="*{bchname}" class="form-control-custom" required maxlength="100" />
                    </div>

                    <div class="col-md-6 form-group">
                        <label class="form-label" for="bchcapacity">Capacity <span style="color: #dc2626;">*</span></label>
                        <input type="number" id="bchcapacity" name="bchcapacity" th:value="*{bchcapacity}" class="form-control-custom" min="1" max="10000" required />
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 form-group">
                        <label class="form-label" for="bchinstcode">Institute Code</label>
                        <input type="text" id="bchinstcode" name="bchinstcode" th:value="*{bchinstcode}" class="form-control-custom" maxlength="50" />
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; border-top: 1px solid #e5e7eb; padding-top: 20px;">
                    <a th:href="@{/admin/master-maintenance/batches/{id}(id=${batch.bchid})}" class="btn-outline">Cancel</a>
                    <button type="submit" class="btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
