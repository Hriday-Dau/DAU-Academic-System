<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Programs List</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <h2 class="section-title">Programs</h2>

        <div th:if="${success}" class="alert-success" id="flashMessage">
            <span th:text="${success}"></span>
        </div>

        <div class="table-container">
            <div class="top-actions" style="margin-bottom: 20px;">
                <a th:href="@{/admin/programs/add}"> <button class="btn">Add New Program</button> </a>
                <!-- <a th:href="@{/admin/programs/add}" class="btn">Add New Program</a> -->

                <!-- <a href="#" class="btn-outline">View Archived Programs</a> -->
                <a th:href="@{/admin/programs/archived}" style="margin-left: auto;"> <button class="btn-outline">View
                        Archived Programs</button></a>
                <!-- <button class="btn-outline">View Archived Programs</button> -->
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="text-align: center; width: 8%;">Program Univ Code</th>
                            <th style="text-align: center; width: 12%;">Program Short Name</th>
                            <th style="text-align: center; width: 40%;">Program Full Name</th>
                            <th style="text-align: center; width: 8%;">Program Level</th>
                            <th style="text-align: center;width: 10%;">Duration</th>
                            <th style="text-align: center; width: 22%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="program : ${programs}">
                            <td style="text-align: center;" th:text="${program.prginstcode}"></td>
                            <td th:text="${program.prgname}" style="font-weight: bold;"></td>
                            <td th:text="${program.prgdesc}"></td>
                            <td style="text-align: center;" th:text="${program.prglevel}"></td>
                            <td style="text-align: center;"
                                th:text="${program.prgduration + ' ' + program.prgdurationunits}"></td>

                            <td class="action-cell">
                                <div class="action-buttons-wrapper">
                                    <a th:href="@{/admin/programs/{id}/view (id=${program.prgid})}"
                                        class="btn-outline btn-action">View</a>

                                    <a th:href="@{/admin/programs/{id}/edit (id=${program.prgid})}"
                                        class="btn-warning btn-action">Edit</a>

                                    <a th:href="@{/admin/programs/{id}/archive (id=${program.prgid})}"
                                        class="btn-danger"
                                        onclick="return confirm('Are you sure you want to archive this program? It will be hidden from the master list.');">Archive</a>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(programs)}">
                            <td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">
                                No active programs found in the database.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>


    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alert = document.getElementById('flashMessage');
            if (alert) alert.style.display = 'none';
        }, 3000);
    </script>

</body>

</html>
