<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${editing} ? 'Edit Program' : 'Add Program'">Program Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <h2 class="section-title" th:text="${editing} ? 'Edit Program Details' : 'Register New Program'" style="margin-top: 0;">Program Form</h2>

        <div class="form-container">
            <div th:if="${error}" class="alert-error" id="flashMessage">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/admin/programs/save}" th:object="${program}" method="post">
                
                <input type="hidden" th:field="*{prgid}" />

                <input type="hidden" name="prgdurationunits" value="Years" />

                <div class="form-group">
                    <label class="form-label">Program Univ Code</label>
                    <input type="number" class="form-control" th:field="*{prginstcode}" placeholder="e.g., 01" required th:readonly="${editing}" />
                </div>

                <div class="form-group">
                    <label class="form-label">Program Short Name</label>
                    <input type="text" class="form-control" th:field="*{prgname}" placeholder="Enter program short name...e.g., B Tech (ICT)" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Program Full Name</label>
                    <textarea class="form-control" th:field="*{prgdesc}" placeholder="Enter program full name" required></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Program Level</label>
                    <!-- <select th:if="${!editing}" class="form-select" th:field="*{prglevel}" required> -->
                    <select class="form-select" th:field="*{prglevel}" required>
                        <option value="">Select level</option>
                        <option value="UG">UG (Undergraduate)</option>
                        <option value="PG">PG (Postgraduate)</option>
                        <option value="Other">Other</option>
                    </select>

                    <input type="hidden" th:field="*{prglevel}" />
                    <!-- <th:block th:if="${editing}">
                        <input type="text" class="form-control" th:value="*{prglevel}" />
                        <input type="hidden" th:field="*{prglevel}" />
                    </th:block> -->
                </div>

                <!-- <div class="form-group" style="display: flex; gap: 16px;">
                    <div style="flex: 1;">
                        <label class="form-label">Duration</label>
                    
                        <input type="number" min="1" class="form-control" th:field="*{prgduration}" required />
                    </div>
                    <div style="flex: 1;">
                        <label class="form-label">Duration Units</label>
                        <select class="form-select" th:field="*{prgdurationunits}" required>
                            <option value="" disabled>Select category</option>
                            <option value="Years">Years</option>
                            <option value="Semesters">Semesters</option>
                        </select>
                    </div>
                </div> -->

                <div class="form-group">
                    <label class="form-label">Duration (in Years)</label>
                    <input type="number" min="1" step="1" class="form-control" 
                           th:field="*{prgduration}" required 
                           th:readonly="${editing}" />
                </div>

                <div class="form-group">
                    <label class="form-label">Program Introduction Date</label>
                    <input type="date" class="form-control" id="prgintrodate" name="prgintrodate" 
                           th:value="${program.prgintrodate != null ? #temporals.format(program.prgintrodate, 'yyyy-MM-dd') : ''}" 
                           required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Save Program</button>
                    <a th:href="${editing} ? @{/admin/programs/{id}/edit (id=${program.prgid})} : @{/admin/programs}" class="btn-danger" style="text-decoration: none; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        // Auto-hide error message after 5 seconds
        setTimeout(() => {
            const alertElement = document.getElementById('flashMessage');
            if (alertElement) {
                alertElement.style.display = 'none';
            }
        }, 5000);
    </script>
</body>
</html>
