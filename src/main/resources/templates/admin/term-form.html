<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Term</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">

    <style>
        .main-content {
            margin-top: 40px;
            margin-bottom: 50px;
            /* max-width: 600px; */
        }

        .form-container {
            background: var(--white);
            padding: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-light);
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            gap: 16px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .alert-error {
            background-color: #fdecea;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            border-left: 4px solid #d32f2f;
        }

        .helper-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            display: block;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">

        <h2 class="section-title" style="margin-top: 0;">Add New Term</h2>

        <div class="form-container">

            <div th:if="${error}" class="alert-error" id="flashMessage">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/admin/terms/add}" method="post">

                <!-- <div class="form-group">
                    <label for="academicYearId" class="form-label">Academic Year</label>
                    <select class="form-select" name="academicYearId" id="academicYearId" required>
                        <option value="">Select Academic Year</option>
                        <option th:each="ay : ${academicYears}" th:value="${ay.ayrid}" th:text="${ay.ayrname}"
                            th:selected="${ay.ayrid == prefillAyrId}">
                        </option>
                    </select>
                    <span class="helper-text">Auto-selected based on the active global academic calendar.</span>
                </div> -->

                <div class="form-group">
                    <label for="academicYearId" class="form-label">Academic Year</label>
                    <select class="form-select" name="academicYearId" id="academicYearId" required>
                        <option value="">Select Academic Year</option>
                        <option th:each="ay : ${academicYears}" th:value="${ay.ayrid}" th:text="${ay.ayrname}"
                            th:selected="${ay.ayrid != null and prefillAyrId != null and ay.ayrid.toString() == prefillAyrId.toString()}">
                        </option>
                    </select>
                    <span class="helper-text">Auto-selected based on the active global academic calendar.</span>
                </div>
                

                <div class="form-group">
                    <label for="termName" class="form-label">Term Name</label>
                    <select class="form-select" id="termName" name="termName" required>
                        <option value="">Select Term</option>
                        <option th:each="name : ${termNames}" th:value="${name}" th:text="${name}"
                            th:selected="${name == prefillTermName}">
                        </option>
                    </select>
                    <span class="helper-text">The next logical term sequence (Autumn → Winter → Summer).</span>
                </div>

                <div class="form-group">
                    <label for="termStartDate" class="form-label">Term Start Date</label>
                    <input type="date" class="form-control" id="termStartDate" name="termStartDate" required>
                </div>

                <div class="form-group">
                    <label for="termEndDate" class="form-label">Term End Date</label>
                    <input type="date" class="form-control" id="termEndDate" name="termEndDate" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Confirm & Save Term</button>
                    <a class="btn-outline" style="text-decoration: none; text-align: center;"
                        th:href="@{/admin/terms}">← Cancel</a>
                </div>

            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alertElement = document.getElementById('flashMessage');
            if (alertElement) alertElement.style.display = 'none';
        }, 5000);
    </script>

</body>

</html>
