<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Users - Master Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .search-box-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .search-input {
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-sm);
            font-size: 14px;
            width: 320px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div>
                <h2 class="section-title" style="margin-bottom: 4px;">Faculty Users</h2>
                <p style="color: var(--text-muted); font-size: 14px;">Master list of all registered faculty members in the university portal.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a th:href="@{/admin/master-maintenance}" class="btn-outline">Back to Hub</a>
                <a th:href="@{/admin/master-maintenance/faculty/add}" class="btn">+ Add New Faculty</a>
            </div>
        </div>

        <!-- Flash messages -->
        <div th:if="${success}" class="alert-success" style="padding: 12px 16px; background-color: #d1fae5; color: #065f46; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-danger" style="padding: 12px 16px; background-color: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${error}"></span>
        </div>

        <div class="table-container">
            <div class="top-actions" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <form method="get" th:action="@{/admin/master-maintenance/faculty}" class="search-box-wrapper">
                    <input type="text" name="search" id="facultySearch" class="search-input" placeholder="Search by name, email, or username..." th:value="${search}">
                    <button type="submit" class="btn-action btn-primary-custom" style="background: var(--primary); color: white;">Search</button>
                    <a th:if="${search != null and !search.isEmpty()}" th:href="@{/admin/master-maintenance/faculty}" class="btn-outline">Clear</a>
                </form>
                <div style="font-size: 14px; color: var(--text-muted);">
                    Total Faculty: <strong th:text="${#lists.size(facultyList)}">0</strong>
                </div>
            </div>

            <div class="table-responsive">
                <table class="data-table" id="facultyTable">
                    <thead>
                        <tr>
                            <th style="width: 8%; text-align: center;">UID</th>
                            <th style="width: 12%;">Univ ID</th>
                            <th style="width: 15%;">Username</th>
                            <th style="width: 25%;">Full Name</th>
                            <th style="width: 25%;">Email</th>
                            <th style="width: 8%; text-align: center;">Role</th>
                            <th style="width: 7%; text-align: center;">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(facultyList)}">
                            <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">
                                No faculty members found. Click "+ Add New Faculty" to register a faculty member.
                            </td>
                        </tr>
                        <tr th:each="f : ${facultyList}">
                            <td style="text-align: center; font-weight: 600;" th:text="${f.uid}"></td>
                            <td th:text="${f.univId != null ? f.univId : '-'}"></td>
                            <td th:text="${f.uname}"></td>
                            <td style="font-weight: 500;" th:text="${f.ufullname}"></td>
                            <td th:text="${f.uemail}"></td>
                            <td style="text-align: center;"><span style="background: #e0e7ff; color: #3730a3; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">Faculty</span></td>
                            <td style="text-align: center;">
                                <span th:if="${f.status == true or f.status == null}" style="color: #059669; font-weight: 600;">Active</span>
                                <span th:if="${f.status == false}" style="color: #dc2626; font-weight: 600;">Inactive</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Client-side real-time filter script -->
    <script>
        document.getElementById('facultySearch')?.addEventListener('keyup', function() {
            const query = this.value.toLowerCase();
            const rows = document.querySelectorAll('#facultyTable tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        });
    </script>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
