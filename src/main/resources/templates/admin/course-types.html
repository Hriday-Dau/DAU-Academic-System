<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Course Types</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>
    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">

        <div style="margin-bottom: 15px; font-size: 14px; color: var(--text-muted);">
            <span th:if="${isEditable}" style="color: #f59e0b; font-weight: 600;">⬤ Edit Mode Active</span>
            <span th:if="${!isEditable}">⬤ View Mode (Read-Only)</span>
        </div>

        <div class="d-flex align-items-center mb-4"
            style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
            <h2 class="section-title" style="margin: 0;">Course Types</h2>

            <div th:if="${error}" class="alert-error" id="flashMessage" style="margin: 0;">
                <span th:text="${error}"></span>
            </div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Course Type Code</th>
                            <th>Category</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Min Courses</th>
                            <th>Max Courses</th>
                            <th>Min Credits</th>
                            <th>Max Credits</th>
                            <th th:if="${isEditable}" style="text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ct : ${courseTypes}">
                            <td th:text="${ct.ctpcode}">CTP</td>
                            <td th:text="${ct.crscat}">CORE</td>
                            <td th:text="${ct.ctpname}">Name</td>
                            <td th:text="${ct.ctpdesc}">Description</td>
                            <td th:text="${ct.minCourses}">0</td>
                            <td th:text="${ct.maxCourses}">0</td>
                            <td th:text="${ct.minCredits}">0</td>
                            <td th:text="${ct.maxCredits}">0</td>

                            <td th:if="${isEditable}" class="action-cell">
                                <div class="action-buttons-wrapper">
                                    <a th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/course-types/{ctpid}/edit (programId=${programId}, schemeId=${scheme.id}, splid=${splid}, ctpid=${ct.ctpid})}"
                                        class="btn-warning">Edit</a>

                                    <a th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/course-types/{ctpid}/delete (programId=${programId}, schemeId=${scheme.id}, splid=${splid}, ctpid=${ct.ctpid})}"
                                        class="btn-danger"
                                        onclick="return confirm('Are you sure you want to delete this course type?');">Delete</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courseTypes)}">
                            <td th:colspan="${isEditable ? 9 : 8}"
                                style="text-align: center; padding: 30px; font-style: italic; color: var(--text-muted);">
                                No course types configured yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bottom-actions">
            <a th:if="${isEditable}" class="btn-success"
                th:href="@{/admin/programs/{programId}/edit/schemes/{schemeId}/{splid}/course-types/add (programId=${programId}, schemeId=${scheme.id}, splid=${splid})}">+
                Add Course Type</a>

            <div class="ms-auto">
                <a class="btn-outline"
                    th:href="${isEditable} ? @{/admin/programs/{programId}/edit/schemes/{schemeId} (programId=${programId}, schemeId=${scheme.id})} : @{/admin/programs/{programId}/view/schemes/{schemeId} (programId=${programId}, schemeId=${scheme.id})}">←
                    Back to Scheme</a>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alertElement = document.getElementById('flashMessage');
            if (alertElement) {
                alertElement.style.display = 'none';
            }
        }, 5000);
    </script>

</body>

</html>
