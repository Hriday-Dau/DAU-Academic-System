<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Maintenance - DAU Academic System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .hub-card {
            background: var(--white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 4px solid var(--primary-dark);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .hub-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
            border-top-color: var(--primary);
            color: inherit;
        }
        .hub-card-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--primary-dark);
            margin: 0;
        }
        .hub-card-arrow {
            font-size: 20px;
            color: var(--primary);
            font-weight: bold;
            transition: transform 0.15s ease;
        }
        .hub-card:hover .hub-card-arrow {
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 class="section-title" style="margin-bottom: 0;">Master Maintenance</h2>
            <a th:href="@{/admin/dashboard}" class="btn-outline">Back to Dashboard</a>
        </div>

        <div th:if="${success}" class="alert-success" style="padding: 12px 16px; background-color: #d1fae5; color: #065f46; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert-danger" style="padding: 12px 16px; background-color: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); margin-bottom: 20px;">
            <span th:text="${error}"></span>
        </div>

        <div class="hub-grid">
            <a th:href="@{/admin/master-maintenance/faculty}" class="hub-card">
                <span class="hub-card-title">1. Faculty Management</span>
                <span class="hub-card-arrow">&rarr;</span>
            </a>

            <a th:href="@{/admin/master-maintenance/batches}" class="hub-card">
                <span class="hub-card-title">2. Batches &amp; Student Import</span>
                <span class="hub-card-arrow">&rarr;</span>
            </a>

            <a th:href="@{/admin/master-maintenance/users}" class="hub-card">
                <span class="hub-card-title">3. User Management</span>
                <span class="hub-card-arrow">&rarr;</span>
            </a>

            <a th:href="@{/admin/master-maintenance/roles}" class="hub-card">
                <span class="hub-card-title">4. Role Master</span>
                <span class="hub-card-arrow">&rarr;</span>
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
