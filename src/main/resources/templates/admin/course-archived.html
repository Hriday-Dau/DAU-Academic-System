    <script>
        function confirmDelete(courseId) {
            return confirm('Are you sure you want to delete course ID ' + courseId + '?');
        }
    </script>
</head>

<body>

    <!-- Common Header -->
    <!-- <div th:insert="~{fragments/commonHeader :: mainHeader}"></div> -->

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="section-title" style="color: #6b7280;">Archived Courses <span
                    style="font-size: 14px; font-weight: normal; margin-left: 10px;"></span>
            </h2>

            <a class="btn-outline" th:href="@{/admin/courses/master-list}">← Back
                to Active Courses</a>
        </div>

        <div th:if="${success}" class="alert-success" id="flashMessage">
            <span th:text="${success}"></span>
        </div>

        <div class="table-container muted-container">
            <table class="data-table muted-table">
                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Course Code</th>
                        <th>Course Name</th>
                        <th>Level</th>
                        <th>Credits</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iterate archived courses -->
                    <tr th:each="course, iterStat : ${archivedCourses}">
                        <td th:text="${iterStat.index + 1}"></td>
                        <td th:text="${course.crscode}"></td>
                        <td th:text="${course.crsname}"></td>
                        <td th:text="${course.crsdiscipline}"></td>
                        <td th:text="${course.crscreditpoints}"></td>
                        <td class="action-cell">
                            <a class="btn-restore" th:href="@{'/admin/courses/restore/' + ${course.crsid}}"
                                onclick="return confirm('Restore this archived course?');" style="font-weight: bold;">
                                <i class="bi bi-arrow-repeat"></i> Restore
                            </a>
                        </td>
                    </tr>

                    <!-- No data case -->
                    <tr th:if="${#lists.isEmpty(archivedCourses)}">
                        <td colspan="6" style="text-align: center; padding: 30px; font-style: italic;">No archived courses available.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const alert = document.getElementById('flashMessage');
            if (alert) alert.style.display = 'none';
        }, 3000);
    </script>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
