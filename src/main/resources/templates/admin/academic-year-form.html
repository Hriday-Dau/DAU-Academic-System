<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Academic Year</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">

    <style>
        .main-content {
            margin-top: 40px;
            margin-bottom: 50px;
            /* max-width: 550px; */
        }

        .form-container {
            background: var(--white);
            padding: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-dark);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: var(--radius-sm);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-light);
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            gap: 16px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .alert-error {
            background-color: #fdecea;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            border-left: 4px solid #d32f2f;
        }

        .helper-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            display: block;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <div th:replace="fragments/header :: header"></div>

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container main-content">

        <h2 class="section-title" style="margin-top: 0;">Add Academic Year</h2>

        <div class="form-container">
            <div th:if="${error}" class="alert-error" id="flashMessage">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/admin/academicyears/add}" method="post">

                <div class="form-group">
                    <label class="form-label">Starting Year</label>
                    <input type="number" class="form-control" name="startYear" th:value="${nextStartYear}"
                        placeholder="e.g. 2026" required>
                    <span class="helper-text">
                        Enter the starting year. The system will automatically generate the full academic year name
                        (e.g., entering <strong>2026</strong> generates <strong>2026-27</strong>).
                    </span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Save Academic Year</button>
                    <a class="btn-outline" style="text-decoration: none; text-align: center;"
                        th:href="'javascript:history.back()'">
                        Cancel
                    </a>
                    <!-- <a class="btn-outline" style="text-decoration: none; text-align: center;"
                        th:href="@{/admin/dashboard}">
                        Back to Dashboard
                    </a> -->
                </div>

            </form>
        </div>

    </div>

    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

    <script>
        setTimeout(() => {
            const alertElement = document.getElementById('flashMessage');
            if (alertElement) alertElement.style.display = 'none';
        }, 5000);
    </script>

</body>

</html>
