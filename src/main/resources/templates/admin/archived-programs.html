<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Archived Programs</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/navdes.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container main-content">
        <h2 class="section-title" style="color: #6b7280;">Archived Programs
            <span style="font-size: 14px; font-weight: normal; margin-left: 10px;"></span>
        </h2>

        <div th:if="${success}" class="alert-success" id="flashMessage">
            <span th:text="${success}"></span>
        </div>

        <div class="table-container muted-container">
            <table class="data-table muted-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">Univ Code</th>
                        <th style="width: 12%;">Program Short Name</th>
                        <th style="width: 30%;">Program Full Name</th>
                        <th style="width: 8%;">Program Level</th>
                        <th style="width: 10%;">Duration</th>
                        <th style="width: 10%;">Date Archived</th>
                        <th style="text-align: center; width: 20%;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="program : ${programs}">
                        <td th:text="${program.prginstcode}"></td>
                        <td th:text="${program.prgname}"></td>
                        <td th:text="${program.prgdesc}"></td>
                        <td th:text="${program.prglevel}"></td>
                        <td th:text="${program.prgduration + ' ' + program.prgdurationunits}"></td>

                        <td th:text="${#temporals.format(program.prglastupdatedat, 'dd MMM yyyy')}"></td>

                        <td class="action-cell">
                            <div class="action-buttons-wrapper">
                                <a th:href="@{/admin/programs/{id}/view (id=${program.prgid})}" class="btn-outline btn-action">View</a>

                                <a th:href="@{/admin/programs/{id}/restore (id=${program.prgid})}" class="btn-restore"
                                    onclick="return confirm('Restore this program? It will become active again.');">
                                    Restore
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(programs)}">
                        <td colspan="7" style="text-align: center; padding: 30px; font-style: italic;">
                            No archived programs found.
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="bottom-actions">
                <a th:href="@{/admin/programs}" class="btn-outline">← Back to Active Programs</a>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const alert = document.getElementById('flashMessage');
            if (alert) alert.style.display = 'none';
        }, 3000);
    </script>
</body>

</html>
